<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Menu</title>
    <link rel="stylesheet" href="../styles/menu.css" />

</head>
<body>
    <div id="popup-content">
        <h2>Counter Settings</h2>
        <div class="control-group">
            <label for="counterCount">Number of Counters:</label>
            <input type="number" id="counterCount" min="1" max="10" value="1">
        </div>
        <button id="apply-button">Apply</button>
        <p class="info-text">Select how many counters you want to display</p>
    </div>
</body>
</html>
